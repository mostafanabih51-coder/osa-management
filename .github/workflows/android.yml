name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Create Android platform
        run: flutter create --platforms=android .

      - name: Enable Android Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = text.replace('<application', permission + '\n    <application', 1)
          p.write_text(text)
          PY

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ] && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/osa-release-key.jks 2>/dev/null && keytool -list -keystore android/osa-release-key.jks -storepass "${KEYSTORE_PASSWORD:-}" >/dev/null 2>&1; then
            echo "Using repository release keystore."
            STORE_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS="$KEYSTORE_ALIAS"
          else
            echo "Repository keystore secret is missing or invalid; generating a CI signing key for this build."
            rm -f android/osa-release-key.jks
            keytool -genkeypair -v \
              -keystore android/osa-release-key.jks \
              -storepass OSA_CI_RELEASE_2026 \
              -keypass OSA_CI_RELEASE_2026 \
              -alias osa-release \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Online School Academy, OU=OSA, O=C, L=Cairo, ST=Cairo, C=EG"
            STORE_PASSWORD="OSA_CI_RELEASE_2026"
            KEY_ALIAS="osa-release"
          fi
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=osa-release-key.jks
          EOF

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          text = p.read_text()
          imports = 'import java.util.Properties\nimport java.io.FileInputStream\n'
          if 'import java.util.Properties' not in text:
              text = imports + text
          load_block = '''\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n'''
          if 'val keystoreProperties = Properties()' not in text:
              text = text.replace('plugins {', load_block + 'plugins {', 1)
          signing_block = '''    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties.getProperty("keyAlias")\n            keyPassword = keystoreProperties.getProperty("keyPassword")\n            storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }\n            storePassword = keystoreProperties.getProperty("storePassword")\n        }\n    }\n\n'''
          if 'create("release")' not in text:
              text = text.replace('    buildTypes {', signing_block + '    buildTypes {', 1)
          text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Clean build
        run: flutter clean

      - name: Build signed Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osa-management-release-signed
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
