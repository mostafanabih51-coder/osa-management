name: Create OSA Release Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create Release Keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore osa-release-key.jks \
            -alias osa \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass OSARelease2026! \
            -keypass OSARelease2026! \
            -dname "CN=OSA, OU=OSA, O=Online School Academy, L=Cairo, ST=Cairo, C=EG"

      - name: Upload Keystore
        uses: actions/upload-artifact@v4
        with:
          name: osa-release-keystore
          path: osa-release-key.jks
