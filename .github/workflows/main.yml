name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Backup Flutter code
        run: |
          mkdir -p /tmp/osa_backup
          cp pubspec.yaml /tmp/osa_backup/pubspec.yaml
          cp -r lib /tmp/osa_backup/lib

      - name: Create fresh Flutter Android project
        run: |
          flutter create -t app --platforms=android --project-name osa_management /tmp/osa_fresh

      - name: Replace project files
        run: |
          rm -rf android
          cp -r /tmp/osa_fresh/android android
          cp /tmp/osa_backup/pubspec.yaml pubspec.yaml
          rm -rf lib
          cp -r /tmp/osa_backup/lib lib

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osa-management-release
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
