name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Validate Laravel dependencies
        working-directory: backend
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Validate Laravel PHP syntax
        working-directory: backend
        run: |
          set -euo pipefail
          find app bootstrap config database routes -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate Laravel routes
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan route:list --path=api >/dev/null

      - name: Production API health check
        run: curl --fail --silent --show-error --retry 3 --retry-delay 2 https://admin.muteatalriyadiaat.com/api/health

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Verify committed Android project
        run: |
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

      - name: Enable Android Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET"/>'
          if permission not in text:
              text = text.replace('<application', permission + '\n    <application', 1)
          p.write_text(text)
          PY

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}" || { echo 'Missing KEYSTORE_BASE64 repository secret.'; exit 1; }
          test -n "${KEYSTORE_PASSWORD:-}" || { echo 'Missing KEYSTORE_PASSWORD repository secret.'; exit 1; }
          test -n "${KEYSTORE_ALIAS:-}" || { echo 'Missing KEYSTORE_ALIAS repository secret.'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/osa-release-key.jks
          keytool -list -keystore android/app/osa-release-key.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEYSTORE_ALIAS
          storeFile=osa-release-key.jks
          EOF

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          text = p.read_text()
          imports = 'import java.util.Properties\nimport java.io.FileInputStream\n'
          if 'import java.util.Properties' not in text:
              text = imports + text
          load = '''\nval keystoreProperties = Properties()\nval keystorePropertiesFile = rootProject.file("key.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n}\n\n'''
          if 'val keystoreProperties = Properties()' not in text:
              text = text.replace('plugins {', load + 'plugins {', 1)
          signing = '''    signingConfigs {\n        create("release") {\n            keyAlias = keystoreProperties.getProperty("keyAlias")\n            keyPassword = keystoreProperties.getProperty("keyPassword")\n            storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }\n            storePassword = keystoreProperties.getProperty("storePassword")\n        }\n    }\n\n'''
          if 'create("release")' not in text:
              text = text.replace('    buildTypes {', signing + '    buildTypes {', 1)
          text = text.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
          p.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter tests
        run: flutter test

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Clean build
        run: flutter clean

      - name: Build signed Release APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          ls -lh "$APK"
          file "$APK"
          sha256sum "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osa-management-release-signed
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
