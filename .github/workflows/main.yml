name: OSA Management Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout OSA
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Create Android platform
        run: |
          flutter create \
            --platforms=android \
            --project-name osa_management \
            .

      - name: Configure Android application ID
        run: |
          sed -i 's/applicationId = "com.example.osa_management"/applicationId = "com.osa.management"/' android/app/build.gradle.kts || true
          sed -i 's/namespace = "com.example.osa_management"/namespace = "com.osa.management"/' android/app/build.gradle.kts || true
          sed -i 's/applicationId "com.example.osa_management"/applicationId "com.osa.management"/' android/app/build.gradle || true
          sed -i 's/namespace "com.example.osa_management"/namespace "com.osa.management"/' android/app/build.gradle || true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: osa-management-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
